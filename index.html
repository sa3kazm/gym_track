<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym & Nutrition Tracker</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js для графіків -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Кастомні стилі -->
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-gray-950 text-white font-sans overflow-x-hidden">
  <!-- ═══════════════════════════════════════════════════════════════════════
       ТОП-БАР (Лого, меню, мобільна панель)
       ═══════════════════════════════════════════════════════════════════════ -->
  <header class="sticky top-0 z-50 border-b border-gray-800 bg-gray-950/95 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <!-- Лого -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-lime-300 rounded-lg flex items-center justify-center font-bold text-gray-950">
          💪
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-green-400 to-lime-300 bg-clip-text text-transparent">
          GymTrack
        </h1>
      </div>

      <!-- Навігація (приховується на мобілі) -->
      <nav class="hidden md:flex gap-2">
        <button class="nav-btn" data-route="profile">Профіль</button>
        <button class="nav-btn" data-route="workout">Тренування</button>
        <button class="nav-btn" data-route="nutrition">Їжа</button>
        <button class="nav-btn" data-route="progress">Прогрес</button>
      </nav>

      <!-- Мобільне меню (hamburger) -->
      <button id="mobile-menu-btn" class="md:hidden p-2 hover:bg-gray-800 rounded-lg transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Мобільне меню (розкладається) -->
    <nav id="mobile-menu" class="hidden md:hidden border-t border-gray-800 bg-gray-900 px-4 py-3 flex flex-col gap-2">
      <button class="nav-btn w-full text-left" data-route="profile">Профіль</button>
      <button class="nav-btn w-full text-left" data-route="workout">Тренування</button>
      <button class="nav-btn w-full text-left" data-route="nutrition">Їжа</button>
      <button class="nav-btn w-full text-left" data-route="progress">Прогрес</button>
    </nav>
  </header>

  <!-- ═══════════════════════════════════════════════════════════════════════
       ОСНОВНИЙ КОНТЕНТ (SPA - Single Page App)
       ═══════════════════════════════════════════════════════════════════════ -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- СЕКЦІЯ: ПРОФІЛЬ ────────────────────────────────────────────────── -->
    <section id="profile-section" class="page hidden">
      <div id="profile-container"></div>
    </section>

    <!-- СЕКЦІЯ: ТРЕНУВАННЯ ─────────────────────────────────────────────── -->
    <section id="workout-section" class="page hidden">
      <!-- Три підсекції: конструктор | щоденник | таймер -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div id="workout-planner-container"></div>
        <div id="workout-log-container"></div>
        <div id="rest-timer-container"></div>
      </div>
    </section>

    <!-- СЕКЦІЯ: ХАРЧУВАННЯ ─────────────────────────────────────────────── -->
    <section id="nutrition-section" class="page hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div id="nutrition-tracker-container"></div>
        <div id="nutrition-search-container"></div>
      </div>
    </section>

    <!-- СЕКЦІЯ: ПРОГРЕС ───────────────────────────────────────────────── -->
    <section id="progress-section" class="page hidden">
      <div id="progress-charts-container"></div>
      <div id="achievements-container" class="mt-6"></div>
    </section>

    <!-- СЕКЦІЯ: ПОМИЛКА (404) ───────────────────────────────────────────── -->
    <section id="error-section" class="page hidden text-center">
      <p class="text-2xl text-gray-400">Сторінка не знайдена</p>
    </section>
  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════════════════════ -->
  <footer class="border-t border-gray-800 bg-gray-950 mt-16 py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm">
      <p>Gym & Nutrition Tracker v1.0 | Всі дані зберігаються локально на твоєму пристрої</p>
      <button id="reset-data-btn" class="mt-3 px-4 py-2 bg-red-900 hover:bg-red-800 rounded text-red-200 text-xs transition">
        ⚠️ Скинути всі дані (розробка)
      </button>
    </div>
  </footer>

  <!-- ═══════════════════════════════════════════════════════════════════════
       СКРИПТИ
       ═══════════════════════════════════════════════════════════════════════ -->

  <!-- Core модулі (з type="module" для import/export) -->
  <script type="module">
    // Точка входу
    import { initApp } from "./js/app.js";
    import { resetAllStorage } from "./js/core/storage.js";

    // Ініціалізація
    initApp();

    // Reset кнопка для розробки
    document.getElementById("reset-data-btn").addEventListener("click", () => {
      if (confirm("Ви впевнені? Всі дані будуть видалені.")) {
        resetAllStorage();
        location.reload();
      }
    });

    // Мобільне меню
    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    mobileMenuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
    mobileMenu.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        mobileMenu.classList.add("hidden");
      });
    });
  </script>
</body>
</html>
