<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогрес | Gym Track</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11121c;
      --panel: #242633;
      --panel-soft: #1b1c28;
      --panel-deep: #151622;
      --line: #343643;
      --text: #f8f8fb;
      --muted: #858999;
      --accent: #ff4c62;
      --accent-2: #ff6a72;
      --shadow: 0 26px 70px rgba(0, 0, 0, .34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 55% 4%, rgba(255, 76, 98, .08), transparent 26rem),
        linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 84px 84px, auto;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      width: min(100%, 940px);
      margin: 0 auto;
      padding: 18px 28px 112px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .title {
      margin: 0;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .edit-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 22px rgba(255, 76, 98, .45);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .edit-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(255, 76, 98, .58);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 22px;
      align-items: stretch;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--panel);
      border: 1px solid rgba(255, 255, 255, .035);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .progress-card {
      grid-column: 1 / -1;
      min-height: 390px;
      padding: 28px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }

    .card h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .card p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(180px, 320px) minmax(104px, 132px);
      gap: 18px;
      align-items: start;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      min-height: 38px;
      color: var(--text);
      background: #2a2c39;
      border: 1px solid rgba(255, 76, 98, .52);
      border-radius: 5px;
      padding: 0 13px;
      outline: none;
    }

    .chart-layout {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 20px;
      min-height: 272px;
    }

    .chart-wrap {
      position: relative;
      min-height: 260px;
      border-radius: 8px;
      overflow: hidden;
    }

    .chart-wrap::before,
    .bars::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 54% 34%, rgba(255, 76, 98, .22), rgba(255, 76, 98, .02) 44%, transparent 70%);
      pointer-events: none;
    }

    canvas {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
    }

    .weight-card,
    .history-card {
      min-height: 340px;
      padding: 28px;
    }

    .weight-card {
      text-align: center;
    }

    .weight-control {
      display: grid;
      grid-template-columns: 52px minmax(112px, 160px) 52px;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 32px 0 30px;
    }

    .round {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: #303241;
      box-shadow: inset 0 1px rgba(255,255,255,.04);
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    .round:hover {
      transform: translateY(-1px);
      background: #3a3d50;
    }

    .weight-display {
      min-height: 76px;
      border-radius: 17px;
      background: #202230;
      border: 1px solid rgba(255,255,255,.035);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .weight-display strong {
      font-size: 42px;
      line-height: 1;
    }

    .weight-display span {
      align-self: flex-end;
      margin-bottom: 16px;
      color: #c2c5d0;
      font-weight: 800;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      text-align: left;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      appearance: none;
      background: linear-gradient(90deg, var(--accent) var(--fill, 10%), #313342 var(--fill, 10%));
      border-radius: 999px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid #f4d5dc;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 76, 98, .5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 4px solid #f4d5dc;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 76, 98, .5);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 30px;
    }

    .action {
      min-height: 58px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      cursor: pointer;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: transform .16s ease, filter .16s ease;
    }

    .action:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .save {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 30px rgba(255, 76, 98, .26);
    }

    .delete {
      background: #3b3e51;
    }

    .history-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .pill {
      justify-self: end;
      color: #c8cbd6;
      background: #3b3d4b;
      border: 0;
      border-radius: 5px;
      padding: 9px 14px;
      font-size: 11px;
      font-weight: 850;
    }

    .bars {
      position: relative;
      min-height: 210px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 22px;
      align-items: end;
      padding: 16px 8px 0;
      overflow: hidden;
    }

    .bar-item {
      position: relative;
      display: grid;
      gap: 10px;
      justify-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .bar {
      width: min(38px, 66%);
      height: var(--height);
      min-height: 36px;
      border-radius: 7px 7px 4px 4px;
      background: linear-gradient(180deg, #ff5a66, #ff445b);
      box-shadow: 0 -8px 24px rgba(255, 76, 98, .18);
      transition: height .28s ease;
    }

    .history-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .history-footer strong {
      display: block;
      color: #fff;
      font-size: 17px;
      margin-top: 4px;
    }

    .history-footer div:last-child {
      text-align: right;
    }

    .nav {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(430px, calc(100% - 34px));
      height: 72px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 9px 14px;
      border-radius: 28px;
      background: rgba(35, 36, 49, .94);
      border: 1px solid rgba(255,255,255,.04);
      box-shadow: 0 18px 54px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
    }

    .nav button {
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: transparent;
      color: #8e92a1;
      display: grid;
      place-items: center;
      gap: 2px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }

    .nav svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.4;
    }

    .nav button.active {
      color: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #2b2e3d;
      color: #fff;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 8px;
      padding: 11px 16px;
      box-shadow: var(--shadow);
      font-weight: 750;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 740px) {
      .app {
        padding: 16px 16px 112px;
      }

      .grid,
      .chart-layout,
      .card-header,
      .filters {
        grid-template-columns: 1fr;
      }

      .progress-card,
      .weight-card,
      .history-card {
        padding: 22px;
      }

      .chart-wrap {
        min-height: 220px;
      }

      .weight-control {
        grid-template-columns: 48px minmax(104px, 145px) 48px;
        gap: 12px;
      }

      .actions {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 class="title">Прогрес</h1>
        <p class="subtitle">Відстежуйте свої досягнення</p>
      </div>
      <button class="edit-button" type="button" aria-label="Редагувати">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
    </header>

    <section class="grid">
      <article class="card progress-card">
        <div class="card-header">
          <div>
            <h2>Динаміка прогреса</h2>
            <p>Графік змінюється разом із вибором вправи</p>
          </div>
          <div class="filters">
            <div>
              <label for="exercise">Упражнение</label>
              <select id="exercise">
                <optgroup label="Грудь">
                  <option>Жим штанги лежачи</option>
                  <option>Жим гантелей під кутом</option>
                  <option>Розведення рук в тренажері</option>
                </optgroup>
                <optgroup label="Спина">
                  <option>Підтягування</option>
                  <option>Тяга верхнього блоку</option>
                  <option>Горизонтальна тяга</option>
                </optgroup>
                <optgroup label="Ноги">
                  <option>Присідання</option>
                  <option>Жим ногами</option>
                  <option>Згинання ніг в тренажері</option>
                </optgroup>
                <optgroup label="Плечі">
                  <option>Жим гантелей сидячи</option>
                  <option>Бокова махи</option>
                  <option>Тяга до підборіддя</option>
                </optgroup>
              </select>
            </div>
            <div>
              <label for="period">Період</label>
              <select id="period">
                <option value="30">30 днів</option>
                <option value="14">14 днів</option>
                <option value="7">7 днів</option>
              </select>
            </div>
          </div>
        </div>

        <div class="chart-layout">
          <div class="chart-wrap">
            <canvas id="lineChart" width="620" height="290" aria-label="Лінійний графік прогресу"></canvas>
          </div>
          <div class="chart-wrap">
            <canvas id="goalChart" width="330" height="290" aria-label="Графік цілі"></canvas>
          </div>
        </div>
      </article>

      <article class="card weight-card">
        <h2>Мої вес</h2>
        <p>Текущий вес тела</p>

        <div class="weight-control">
          <button class="round" id="minus" type="button" aria-label="Зменшити вагу">-</button>
          <div class="weight-display">
            <strong id="weightValue">63</strong>
            <span>кг</span>
          </div>
          <button class="round" id="plus" type="button" aria-label="Збільшити вагу">+</button>
        </div>

        <div class="slider-row">
          <input id="weightSlider" type="range" min="60" max="90" value="63" aria-label="Вага">
          <div class="range-labels">
            <span>60 кг</span>
            <span>90 кг</span>
          </div>
        </div>

        <div class="actions">
          <button class="action save" id="save" type="button">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
              <path d="M17 21v-8H7v8"/>
              <path d="M7 3v5h8"/>
            </svg>
            Сохранить в график
          </button>
          <button class="action delete" id="remove" type="button">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18"/>
              <path d="M8 6V4h8v2"/>
              <path d="M19 6l-1 15H6L5 6"/>
            </svg>
            Удалить
          </button>
        </div>
      </article>

      <article class="card history-card">
        <button class="pill" type="button" id="rangeButton">Последние 5 дней</button>
        <div class="bars" id="bars"></div>
        <div class="history-footer">
          <div>
            <span id="firstDate">15.05</span>
            <strong id="minWeight">60 кг</strong>
          </div>
          <div>
            <span id="lastDate">19.05</span>
            <strong id="maxWeight">90 кг</strong>
          </div>
        </div>
      </article>
    </section>
  </main>

  <nav class="nav" aria-label="Головна навігація">
    <button type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 20V10"/><path d="M18 20V10"/><path d="M3 20h18"/><path d="M8 10V5h8v5"/><path d="M5 10h14"/></svg>
      Тренировки
    </button>
    <button class="active" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3-3 3 2 5-7"/></svg>
      Прогресс
    </button>
    <button type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
      Дни
    </button>
    <button type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </button>
  </nav>

  <div class="toast" id="toast">Збережено</div>

  <script>
    const exerciseSelect = document.querySelector("#exercise");
    const periodSelect = document.querySelector("#period");
    const weightSlider = document.querySelector("#weightSlider");
    const weightValue = document.querySelector("#weightValue");
    const barsEl = document.querySelector("#bars");
    const toast = document.querySelector("#toast");
    const lineCanvas = document.querySelector("#lineChart");
    const goalCanvas = document.querySelector("#goalChart");

    const seed = {
      "Жим штанги лежачи": [62, 78, 91, 106, 118],
      "Жим гантелей під кутом": [22, 24, 28, 30, 32],
      "Розведення рук в тренажері": [35, 38, 41, 43, 47],
      "Підтягування": [5, 7, 8, 10, 12],
      "Тяга верхнього блоку": [55, 62, 69, 74, 78],
      "Горизонтальна тяга": [45, 52, 59, 63, 68],
      "Присідання": [75, 90, 105, 118, 132],
      "Жим ногами": [120, 150, 180, 205, 230],
      "Згинання ніг в тренажері": [28, 34, 38, 42, 46],
      "Жим гантелей сидячи": [18, 22, 24, 26, 30],
      "Бокова махи": [8, 10, 12, 14, 16],
      "Тяга до підборіддя": [22, 27, 32, 36, 40]
    };

    let state = {
      weight: 63,
      weights: [60, 74, 76, 82, 68],
      exercise: exerciseSelect.value,
      exerciseData: JSON.parse(JSON.stringify(seed))
    };

    function fitSlider() {
      const min = Number(weightSlider.min);
      const max = Number(weightSlider.max);
      const fill = ((state.weight - min) / (max - min)) * 100;
      weightSlider.style.setProperty("--fill", `${fill}%`);
    }

    function setWeight(value) {
      state.weight = Math.max(60, Math.min(90, Number(value)));
      weightValue.textContent = state.weight;
      weightSlider.value = state.weight;
      fitSlider();
      drawAll();
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function dates(count) {
      const base = new Date(2026, 4, 15);
      return Array.from({ length: count }, (_, index) => {
        const date = new Date(base);
        date.setDate(base.getDate() + index);
        return `${String(date.getDate()).padStart(2, "0")}.${String(date.getMonth() + 1).padStart(2, "0")}`;
      });
    }

    function drawGrid(ctx, width, height, left, top, chartW, chartH, maxValue) {
      ctx.strokeStyle = "rgba(255,255,255,.055)";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#7e8293";
      ctx.font = "12px Inter, system-ui, sans-serif";

      for (let i = 0; i <= 6; i += 1) {
        const y = top + (chartH / 6) * i;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + chartW, y);
        ctx.stroke();
        const label = Math.round(maxValue - (maxValue / 6) * i);
        ctx.fillText(label, 8, y + 4);
      }
    }

    function drawLineChart() {
      const ctx = lineCanvas.getContext("2d");
      const width = lineCanvas.width;
      const height = lineCanvas.height;
      const data = state.exerciseData[state.exercise] || seed["Жим штанги лежачи"];
      const labels = dates(data.length);
      const left = 58;
      const right = 20;
      const top = 22;
      const bottom = 42;
      const chartW = width - left - right;
      const chartH = height - top - bottom;
      const maxValue = Math.ceil((Math.max(...data, 90) + 18) / 10) * 10;

      ctx.clearRect(0, 0, width, height);
      drawGrid(ctx, width, height, left, top, chartW, chartH, maxValue);

      const gradient = ctx.createLinearGradient(0, top, 0, height);
      gradient.addColorStop(0, "rgba(255, 76, 98, .42)");
      gradient.addColorStop(1, "rgba(255, 76, 98, 0)");

      const points = data.map((value, index) => ({
        x: left + (chartW / (data.length - 1 || 1)) * index,
        y: top + chartH - (value / maxValue) * chartH
      }));

      ctx.beginPath();
      points.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.lineTo(points[points.length - 1].x, top + chartH);
      ctx.lineTo(points[0].x, top + chartH);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      points.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.strokeStyle = "#ff4c62";
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

      points.forEach(point => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#2a2c39";
        ctx.fill();
        ctx.strokeStyle = "#ff4c62";
        ctx.lineWidth = 4;
        ctx.stroke();
      });

      ctx.fillStyle = "#777b8b";
      ctx.font = "12px Inter, system-ui, sans-serif";
      labels.forEach((label, index) => {
        const x = left + (chartW / (labels.length - 1 || 1)) * index;
        ctx.fillText(label, x - 17, height - 14);
      });
    }

    function drawGoalChart() {
      const ctx = goalCanvas.getContext("2d");
      const width = goalCanvas.width;
      const height = goalCanvas.height;
      const left = 26;
      const top = 20;
      const chartW = width - 48;
      const chartH = height - 54;
      const current = state.exerciseData[state.exercise].at(-1);
      const target = Math.max(90, Math.ceil((current + 24) / 10) * 10);
      const nowY = top + chartH - (current / target) * chartH;
      const targetY = top + chartH - (target / target) * chartH;

      ctx.clearRect(0, 0, width, height);

      const gradient = ctx.createLinearGradient(0, top, 0, height);
      gradient.addColorStop(0, "rgba(255, 76, 98, .45)");
      gradient.addColorStop(1, "rgba(255, 76, 98, 0)");

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(left, nowY);
      ctx.lineTo(left + chartW, targetY);
      ctx.lineTo(left + chartW, top + chartH);
      ctx.lineTo(left, top + chartH);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#ff4c62";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(left, nowY);
      ctx.lineTo(left + chartW, targetY);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(left + chartW, targetY, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#2a2c39";
      ctx.fill();
      ctx.strokeStyle = "#ff4c62";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = "#7e8293";
      ctx.font = "12px Inter, system-ui, sans-serif";
      ctx.fillText("15.5.2026", left + chartW - 64, height - 14);
    }

    function renderBars() {
      const labels = dates(state.weights.length);
      barsEl.innerHTML = state.weights.map((weight, index) => {
        const height = 54 + ((weight - 60) / 30) * 116;
        return `
          <div class="bar-item">
            <div class="bar" style="--height: ${height}px"></div>
            <span>${labels[index]}</span>
          </div>
        `;
      }).join("");
      document.querySelector("#firstDate").textContent = labels[0];
      document.querySelector("#lastDate").textContent = labels[labels.length - 1];
      document.querySelector("#minWeight").textContent = `${Math.min(...state.weights)} кг`;
      document.querySelector("#maxWeight").textContent = `${Math.max(...state.weights)} кг`;
    }

    function drawAll() {
      drawLineChart();
      drawGoalChart();
      renderBars();
    }

    document.querySelector("#minus").addEventListener("click", () => setWeight(state.weight - 1));
    document.querySelector("#plus").addEventListener("click", () => setWeight(state.weight + 1));
    weightSlider.addEventListener("input", event => setWeight(event.target.value));
    exerciseSelect.addEventListener("change", event => {
      state.exercise = event.target.value;
      drawAll();
    });
    periodSelect.addEventListener("change", event => {
      document.querySelector("#rangeButton").textContent = `Последние ${Math.min(5, Number(event.target.value))} дней`;
      showToast(`Період: ${event.target.value} днів`);
    });
    document.querySelector("#save").addEventListener("click", () => {
      state.weights.push(state.weight);
      state.weights = state.weights.slice(-5);
      const data = state.exerciseData[state.exercise];
      data.push(state.weight + Math.round(Math.random() * 18));
      state.exerciseData[state.exercise] = data.slice(-5);
      drawAll();
      showToast("Дані додані в графік");
    });
    document.querySelector("#remove").addEventListener("click", () => {
      if (state.weights.length > 1) state.weights.pop();
      const data = state.exerciseData[state.exercise];
      if (data.length > 1) data.pop();
      drawAll();
      showToast("Останній запис видалено");
    });

    window.addEventListener("resize", drawAll);
    setWeight(state.weight);
  </script>
</body>
</html>
